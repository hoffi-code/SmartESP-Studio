services:
  smartesp-studio:
    image: ghcr.io/hoffi-code/smartesp-studio:latest
    container_name: smartesp-studio
    restart: unless-stopped
    network_mode: host
    labels:
      com.centurylinklabs.watchtower.scope: smartesp
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      SES_MODE: standalone
      SES_PORT: ${SES_PORT:-8099}
      SES_USE_ESPHOME_SHARED_PATH: ${SES_USE_ESPHOME_SHARED_PATH:-false}
      SES_AUTH_MODE: ${SES_AUTH_MODE:-basic}
      SES_AUTH_USERNAME: ${SES_AUTH_USERNAME:-admin}
      SES_AUTH_PASSWORD: ${SES_AUTH_PASSWORD:-change-me}
    volumes:
      - ./config:/config
      - ./data:/data
      - ./build:/build
      - /etc/localtime:/etc/localtime:ro

  watchtower:
    image: containrrr/watchtower:latest
    container_name: smartesp-watchtower
    restart: unless-stopped
    command: --scope smartesp --cleanup --interval 86400
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.scope: smartesp
