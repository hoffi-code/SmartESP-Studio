services:
  smartesp-studio:
    image: ghcr.io/hoffi-code/smartesp-studio:latest
    container_name: smartesp-studio
    restart: unless-stopped

    ports:
      - "${SES_PORT:-8099}:${SES_PORT:-8099}"

    environment:
      TZ: ${TZ:-Europe/Warsaw}
      SES_MODE: standalone
      SES_PORT: ${SES_PORT:-8099}
      SES_USE_ESPHOME_SHARED_PATH: ${SES_USE_ESPHOME_SHARED_PATH:-false}
      SES_STATUS_USE_PING: "true"
      SES_AUTH_MODE: ${SES_AUTH_MODE:-basic}
      SES_AUTH_USERNAME: ${SES_AUTH_USERNAME:-admin}
      SES_AUTH_PASSWORD: ${SES_AUTH_PASSWORD:-change-me}

    volumes:
      - ./config:/config
      - ./data:/data
      - ./build:/build
      - /etc/localtime:/etc/localtime:ro

    # Required for the "Serial port (HA Server)" install mode.
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyACM0:/dev/ttyACM0
